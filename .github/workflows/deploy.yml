name: Build and Deploy Wasm to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Make kotlin wrapper executable
        run: chmod +x ./kotlin

      - name: Cache Shared Toolchains, JDKs & Build Outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            build
            .amper
          key: kotlin-full-cache-${{ hashFiles('kotlin', 'module.yaml') }}
          restore-keys: |
            kotlin-full-cache-

      - name: Build Wasm Release
        run: ./kotlin build -v release

      - name: Prepare Clean Dist & Optimize Wasm Size
        run: |
          # 1. تثبيت أداة binaryen لضغط الـ Wasm
          sudo apt-get update && sudo apt-get install -y binaryen
          
          # 2. إنشاء مجلد التوزيع الصافي
          mkdir -p dist
          
          # 3. العثور على مسار مخرجات linkWasmJs ونقلها إلى dist
          WASM_OUTPUT_DIR=$(find build/tasks -type d -name "*linkWasmJs*" | head -n 1)
          if [ -d "$WASM_OUTPUT_DIR" ]; then
            cp -r $WASM_OUTPUT_DIR/* dist/
          else
            echo "Warning: linkWasmJs directory not found!"
          fi
          
          # 4. ضغط كل ملفات .wasm داخل مجلد dist لأقصى تقليص حجم ممكِن
          find dist -name "*.wasm" -exec wasm-opt -Oz {} -o {} \;

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

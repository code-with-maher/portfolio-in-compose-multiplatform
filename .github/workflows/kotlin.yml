name: Build and Deploy Wasm to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Make kotlin wrapper executable
        run: chmod +x ./kotlin

      - name: Cache Kotlin Toolchain and Build Outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            build/
          key: kotlin-wasm-build-${{ hashFiles('kotlin', 'module.yaml') }}
          restore-keys: |
            kotlin-wasm-build-

      - name: Build Wasm
        run: ./kotlin build release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

name: Build and Deploy Wasm to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Make kotlin wrapper executable
        run: chmod +x ./kotlin

      - name: Cache Kotlin CLI
        uses: actions/cache@v6
        with:
          path: ~/.cache/JetBrains/Kotlin/cli
          key: kotlin-cli-${{ hashFiles('kotlin') }}

      - name: Build Wasm
        run: ./kotlin build -v release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

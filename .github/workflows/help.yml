name: Kotlin CLI Help Inspection

on:
  workflow_dispatch:

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  inspect-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Make kotlin wrapper executable
        run: chmod +x ./kotlin

      - name: Show full Kotlin CLI help
        run: ./kotlin --help
